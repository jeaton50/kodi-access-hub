<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1622">
  <title>JMediaBox Enhanced Menu</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="enhanced.css">
</head>
<body>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>
  <div class="app">
    <header class="top">
      <div class="top-left">
        <a class="brand" href="#home">jmediabox</a>
        <span class="device" id="device-name"></span>
      </div>
      <div class="top-right">
        <div class="clock" id="clock"></div>
        <div class="weather" id="weather" hidden><span id="weather-temp"></span><small id="weather-text"></small></div>
      </div>
    </header>

    <div class="banner" id="banner" hidden></div>

    <section class="hero" id="hero" aria-live="polite">
      <h1 id="hero-title">Home</h1>
      <p class="hero-meta" id="hero-meta">Pick a section, or scroll down through your rows</p>
      <p class="hero-plot" id="hero-plot"></p>
    </section>

    <main id="view" tabindex="-1"></main>

    <p class="hint" id="hint">Arrow keys browse • Enter opens • Esc goes back</p>
  </div>

  <aside class="now" id="now" hidden aria-label="Now playing on the TV">
    <img class="now-art" id="now-art" alt="">
    <div class="now-text"><strong id="now-title"></strong><span id="now-sub"></span>
      <div class="now-bar"><div id="now-progress"></div></div></div>
    <div class="now-controls">
      <button type="button" data-player="back" aria-label="Back 30 seconds">−30</button>
      <button type="button" data-player="toggle" id="now-toggle" aria-label="Play or pause">❚❚</button>
      <button type="button" data-player="forward" aria-label="Forward 30 seconds">+30</button>
      <button type="button" data-player="stop" aria-label="Stop">■</button>
    </div>
  </aside>

  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-card">
      <button class="sheet-close" type="button" id="sheet-close" aria-label="Close">×</button>
      <div class="sheet-art" id="sheet-art"></div>
      <div class="sheet-body">
        <h2 id="sheet-title"></h2>
        <p class="sheet-meta" id="sheet-meta"></p>
        <p class="sheet-plot" id="sheet-plot"></p>
        <div class="sheet-actions" id="sheet-actions"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">The Enhanced menu needs JavaScript.</p></noscript>
  <script src="demo.js" defer></script>
  <script src="enhanced.js" defer></script>
</body>
</html>
